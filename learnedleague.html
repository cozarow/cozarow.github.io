<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LearnedLeague Player Similarity</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/style.css">
<style>
  body {
    background-color: black;
    color: #e8e8e8;
    font-family: Quicksand, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 0.9em;
    color: #b5b5b5;
  }
  select, input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 1em;
    background: #1a1a1a;
    color: #e8e8e8;
    border: 1px solid #444;
    border-radius: 4px;
  }
  button {
    margin-top: 16px;
    padding: 8px 20px;
    font-size: 1em;
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    margin-top: 12px;
    color: #999;
    font-size: 0.9em;
  }
  #results {
    margin-top: 20px;
  }
  #results table {
    width: 100%;
    border-collapse: collapse;
  }
  #results td {
    padding: 4px 8px;
    border-bottom: 1px solid #333;
  }
  #results td.rank { color: #888; width: 2em; }
  #results td.pct { text-align: right; font-variant-numeric: tabular-nums; }
  .single-score {
    font-size: 1.4em;
    margin-top: 8px;
  }
  .error { color: #e88; }
  .hint { color: #999; font-size: 1em; }
</style>
</head>
<body>

<h1>LearnedLeague Player Similarity</h1>
<p class="hint">
  Enter one person's LL player name (e.g. <code>IntegrityT</code>) to see the 25 players most similar to them, or enter two players to see how similar they are.
</p>

<label for="season">Season</label>
<select id="season">
  <option value="109">LL109</option>
  <option value="108">LL108</option>
</select>

<label for="name1">Player</label>
<input type="text" id="name1" autocomplete="off" placeholder="e.g. IntegrityT">

<label for="name2">Compare against (optional)</label>
<input type="text" id="name2" autocomplete="off" placeholder="leave blank for top 25">

<label for="maxDaysForfeited">Max. days forfeited (top 25 most similar players only)</label>
<input type="text" inputmode="numeric" id="maxDaysForfeited" value="0">

<button id="submit">Go</button>

<div id="status"></div>
<div id="results"></div>

<script>
// Data is loaded lazily and cached per season -- switching seasons or
// re-querying the same one never re-fetches.
const dataCache = {}; // season -> { answers: {label: str}, indexes, nonForfeitCounts, correctCounts }

// For plain-name lookups: lowercase(base name, no "(rundle)" suffix) ->
// list of full labels. Most names map to exactly one label; only names
// that collided across rundles this season have more than one.
function buildIndexes(answers) {
  const exact = new Map();   // lowercase(full label) -> full label
  const base = new Map();    // lowercase(base name)  -> [full labels]
  for (const label of Object.keys(answers)) {
    exact.set(label.toLowerCase(), label);
    const baseName = label.replace(/\s*\([^)]*\)$/, "");
    const key = baseName.toLowerCase();
    if (!base.has(key)) base.set(key, []);
    base.get(key).push(label);
  }
  return { exact, base };
}

// Per-player counts, derived once per season from their own answer
// string: non-forfeit count (chars that aren't "F"/".") and correct
// count (chars that are "1"). These back the min_non_forfeit/min_correct
// filters -- see one_pairwise_agreement's _filter_players in
// ll_all_rundle_analysis.py, which this mirrors.
function buildCounts(answers) {
  const nonForfeit = new Map();
  const correct = new Map();
  for (const [label, [, s]] of Object.entries(answers)) {
    let nf = 0, c = 0;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch !== "F" && ch !== ".") nf++;
      if (ch === "1") c++;
    }
    nonForfeit.set(label, nf);
    correct.set(label, c);
  }
  return { nonForfeit, correct };
}

// "C_Nebula_Div_1" -> "C Nebula Div 1"
function formatRundle(rundle) {
  return rundle.replace(/_/g, " ");
}

async function loadSeason(season) {
  if (dataCache[season]) return dataCache[season];
  const res = await fetch(`ll_data/with_rundle_${season}.json`);
  if (!res.ok) {
    throw new Error(`Couldn't load data for LL${season}.`);
  }
  const answers = await res.json();
  const indexes = buildIndexes(answers);
  const counts = buildCounts(answers);
  const entry = { answers, indexes, ...counts };
  dataCache[season] = entry;
  return entry;
}

// Ranks every other qualifying player against `label` by pairwise
// agreement, descending -- the live equivalent of one_pairwise_agreement.
// minNonForfeit/minCorrect filter which *other* players are eligible,
// exactly like the Python version's same-named parameters.
function topMatches(label, entry, minNonForfeit, minCorrect, limit) {
  const [, s1] = entry.answers[label];
  const results = [];
  for (const [otherLabel, [rundle, s2]] of Object.entries(entry.answers)) {
    if (otherLabel === label) continue;
    if (entry.nonForfeit.get(otherLabel) < minNonForfeit) continue;
    if (entry.correct.get(otherLabel) < minCorrect) continue;
    const frac = pairwiseAgreement(s1, s2);
    if (frac !== null) results.push([otherLabel, rundle, frac]);
  }
  results.sort((a, b) => b[2] - a[2]);
  return results.slice(0, limit);
}

// Resolve a raw user-typed name to a full label. Returns:
//   { label: "..." }                  -- unambiguous match
//   { candidates: ["...", "..."] }    -- ambiguous, needs disambiguation
//   { notFound: true }                -- no match
function resolveName(raw, entry) {
  const q = raw.trim().toLowerCase();
  if (!q) return { notFound: true };
  const exactHit = entry.indexes.exact.get(q);
  if (exactHit) return { label: exactHit };
  const baseHits = entry.indexes.base.get(q);
  if (!baseHits) return { notFound: true };
  if (baseHits.length === 1) return { label: baseHits[0] };
  return { candidates: baseHits };
}

// Mirrors pairwise_agreement in ll_all_rundle_analysis.py: fraction of
// questions where both players answered (not "F"/missing) and agreed.
function pairwiseAgreement(s1, s2) {
  let agree = 0, valid = 0;
  const n = Math.min(s1.length, s2.length);
  for (let i = 0; i < n; i++) {
    const a = s1[i], b = s2[i];
    if (a === "F" || a === "." || b === "F" || b === ".") continue;
    valid++;
    if (a === b) agree++;
  }
  return valid > 0 ? agree / valid : null;
}

function fmtPct(frac) {
  return (frac * 100).toFixed(1) + "%";
}

function renderCandidates(raw, candidates, targetInputId) {
  const div = document.createElement("div");
  div.innerHTML = `<span class="error">"${raw}" matches more than one player this season:</span>`;
  const list = document.createElement("div");
  for (const label of candidates) {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.style.marginRight = "6px";
    btn.style.marginTop = "6px";
    btn.onclick = () => {
      document.getElementById(targetInputId).value = label;
      document.getElementById("submit").click();
    };
    list.appendChild(btn);
  }
  div.appendChild(list);
  return div;
}

async function runQuery() {
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = "";
  statusEl.textContent = "";

  const season = document.getElementById("season").value;
  const raw1 = document.getElementById("name1").value;
  const raw2 = document.getElementById("name2").value;

  if (!raw1.trim()) {
    statusEl.innerHTML = '<span class="error">Enter at least one player.</span>';
    return;
  }

  statusEl.textContent = "Loading...";
  let entry;
  try {
    entry = await loadSeason(season);
  } catch (e) {
    statusEl.innerHTML = `<span class="error">${e.message}</span>`;
    return;
  }
  statusEl.textContent = "";

  const r1 = resolveName(raw1, entry);
  if (r1.notFound) {
    statusEl.innerHTML = `<span class="error">"${raw1}" not found in LL${season}.</span>`;
    return;
  }
  if (r1.candidates) {
    resultsEl.appendChild(renderCandidates(raw1, r1.candidates, "name1"));
    return;
  }

  if (!raw2.trim()) {
    // One name -> top 25, ranked live against every qualifying player.
    const maxDaysForfeited = parseInt(document.getElementById("maxDaysForfeited").value, 10) || 0;
    const minNonForfeit = 150 - maxDaysForfeited * 6;
    const minCorrect = 10; // Hard-coded to match the Python version's default.
    const matches = topMatches(r1.label, entry, minNonForfeit, minCorrect, 25);
    if (matches.length === 0) {
      statusEl.textContent = `No qualifying comparisons found for ${r1.label}.`;
      return;
    }
    const table = document.createElement("table");
    matches.forEach(([otherLabel, rundle, frac], i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="rank">${i + 1}</td><td>${otherLabel}</td><td>${formatRundle(rundle)}</td><td class="pct">${fmtPct(frac)}</td>`;
      table.appendChild(tr);
    });
    resultsEl.innerHTML = `<div>Most similar to <strong>${r1.label}</strong>:</div>`;
    resultsEl.appendChild(table);
    return;
  }

  // Two names -> direct pairwise agreement.
  const r2 = resolveName(raw2, entry);
  if (r2.notFound) {
    statusEl.innerHTML = `<span class="error">"${raw2}" not found in LL${season}.</span>`;
    return;
  }
  if (r2.candidates) {
    resultsEl.appendChild(renderCandidates(raw2, r2.candidates, "name2"));
    return;
  }

  const frac = pairwiseAgreement(entry.answers[r1.label][1], entry.answers[r2.label][1]);
  resultsEl.innerHTML = frac === null
    ? `<div class="error">${r1.label} and ${r2.label} have no overlapping answered questions.</div>`
    : `<div>Agreement between <strong>${r1.label}</strong> and <strong>${r2.label}</strong>:</div>
       <div class="single-score">${fmtPct(frac)}</div>`;
}

document.getElementById("submit").addEventListener("click", runQuery);
for (const id of ["name1", "name2"]) {
  document.getElementById(id).addEventListener("keydown", (e) => {
    if (e.key === "Enter") runQuery();
  });
}
</script>

</body>
</html>
